name: "Build & Release"

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - uses: actions/checkout@v3

      # Step 2: Create secrets.dart dynamically
      - name: Create secrets.dart
        run: |
          mkdir -p lib/secrets
          echo "const String GEMINI_API_KEY = '${{ secrets.GEMINI_API_KEY }}';" > lib/secrets/secrets.dart
          echo "const String GOOGLE_MAP_API_KEY = '${{ secrets.MAPS_API_KEY }}';" >> lib/secrets/secrets.dart

      # Step 3: Create secrets.properties for Android (MAPS_API_KEY)
      - name: Create secrets.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > android/secrets.properties

      # Step 4: Decode and Setup Android Keystore from GitHub Secrets
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks

      # Step 5: Create key.properties for signing release builds
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # Step 6: Read Flutter version from .fvmrc
      - name: Read Flutter version from .fvmrc
        id: fvm-config
        uses: kuhnroyal/flutter-fvm-config-action@v3

      # Step 7: Set up Flutter using the version from .fvmrc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config.outputs.FLUTTER_VERSION }}
          architecture: x64

      # Step 8: Set up Java environment
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 9: Build the release APKs
      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      # Step 10: Upload artifacts to GitHub Releases (Only on push to master)
      - name: Push to Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/apk/release/*"
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}
          allowUpdates: true
          replacesArtifacts: true